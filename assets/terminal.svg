<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4a7e7" stop-opacity=".35"/>
      <stop offset="1" stop-color="#9ccfd8" stop-opacity=".35"/>
    </linearGradient>
    <style>
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .type { animation: type 3.2s steps(26) 0.6s both; }
      @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    </style>
  </defs>

  <!-- window (Alacritty, decorations = None, padding 10) -->
  <rect x="6" y="6" width="848" height="388" rx="14" fill="url(#glow)"/>
  <rect x="10" y="10" width="840" height="380" rx="12" fill="#191724"/>

  <!-- tmux status bar (top, catppuccin style) -->
  <rect x="10" y="10" width="840" height="30" rx="12" fill="#1f1d2e"/>
  <rect x="10" y="28" width="840" height="12" fill="#1f1d2e"/>
  <rect x="22" y="16" width="86" height="18" rx="9" fill="#26233a"/>
  <rect x="22" y="16" width="22" height="18" rx="9" fill="#c4a7e7"/>
  <text x="29" y="30" fill="#191724" font-weight="bold">1</text>
  <text x="52" y="30" fill="#e0def4">nvim</text>
  <rect x="116" y="16" width="86" height="18" rx="9" fill="#26233a"/>
  <rect x="116" y="16" width="22" height="18" rx="9" fill="#f6c177"/>
  <text x="123" y="30" fill="#191724" font-weight="bold">2</text>
  <text x="146" y="30" fill="#e0def4">zsh</text>
  <rect x="590" y="16" width="160" height="18" rx="9" fill="#26233a"/>
  <text x="602" y="30" fill="#ebbcba">~/dotfiles</text>
  <rect x="758" y="16" width="80" height="18" rx="9" fill="#9ccfd8"/>
  <text x="770" y="30" fill="#191724" font-weight="bold">main</text>

  <!-- starship prompt line 1 -->
  <g transform="translate(26,72)">
    <rect x="0" y="-15" width="96" height="22" rx="11" fill="#26233a"/>
    <text x="12" y="1" fill="#c4a7e7">◉ victor</text>
    <rect x="104" y="-15" width="150" height="22" rx="11" fill="#26233a"/>
    <text x="116" y="1" fill="#31748f">…/dev/dotfiles</text>
    <rect x="262" y="-15" width="92" height="22" rx="11" fill="#26233a"/>
    <text x="274" y="1" fill="#9ccfd8">⎇ main</text>
    <rect x="566" y="-15" width="92" height="22" rx="11" fill="#26233a"/>
    <text x="578" y="1" fill="#31748f">⬢ v22.4</text>
    <rect x="666" y="-15" width="142" height="22" rx="11" fill="#26233a"/>
    <text x="678" y="1" fill="#ebbcba">08:42pm ◷</text>
  </g>
  <!-- line 2 -->
  <text x="34" y="102" fill="#c4a7e7" font-size="16">╰─❯</text>
  <g class="type"><text x="76" y="102" fill="#e0def4">./install.sh nvim tmux</text></g>

  <!-- output -->
  <text x="34" y="134" fill="#9ccfd8">✔ <tspan fill="#e0def4">nvim</tspan></text>
  <text x="34" y="156" fill="#9ccfd8">✔ <tspan fill="#e0def4">tmux</tspan></text>
  <text x="34" y="178" fill="#c4a7e7">➜ <tspan fill="#908caa">open tmux and press  prefix (Ctrl+s) + I  to fetch plugins</tspan></text>

  <!-- prompt again -->
  <g transform="translate(26,218)">
    <rect x="0" y="-15" width="96" height="22" rx="11" fill="#26233a"/>
    <text x="12" y="1" fill="#c4a7e7">◉ victor</text>
    <rect x="104" y="-15" width="150" height="22" rx="11" fill="#26233a"/>
    <text x="116" y="1" fill="#31748f">…/dev/dotfiles</text>
    <rect x="262" y="-15" width="92" height="22" rx="11" fill="#26233a"/>
    <text x="274" y="1" fill="#9ccfd8">⎇ main</text>
    <rect x="666" y="-15" width="142" height="22" rx="11" fill="#26233a"/>
    <text x="678" y="1" fill="#ebbcba">08:43pm ◷</text>
  </g>
  <text x="34" y="248" fill="#c4a7e7" font-size="16">╰─❯</text>
  <text x="76" y="248" fill="#e0def4">nvim</text>

  <!-- mini neovim alpha splash -->
  <rect x="34" y="266" width="792" height="108" rx="8" fill="#1f1d2e"/>
  <text x="56" y="298" fill="#c4a7e7" font-weight="bold" font-size="22" letter-spacing="6">N E O V I M</text>
  <text x="56" y="324" fill="#908caa">[C-p] files   [␣fg] grep   [-] oil   [C-n] neo-tree   [␣lg] lazygit</text>
  <text x="56" y="350" fill="#6e6a86">catppuccin-mocha · transparent · lsp via mason · copilot · 29 plugins (lazy.nvim)</text>
  <rect x="808" y="340" width="9" height="16" fill="#e0def4" class="cursor"/>
</svg>
